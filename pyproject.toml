[project]
name = "hex-o-spell-experiment"
version = "0.1.0"
description = "Desktop application for BCI experiments using BrainAccess EEG headset (motor imagery, SSVEP). Part of the BrainBoard project."
authors = [
    {name = "Koło Naukowe Neuron"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.24.0",
    "pyqt6 (>=6.10.2,<7.0.0)",
    "brainaccess==3.6.1",
    "pyyaml==6.0.3",
    "pyedflib>=0.1.37"
]

[project.optional-dependencies]
dev = [
    "black>=23.9.1",
    "flake8>=6.0.0",
    "mypy>=1.5.1",
    "pre-commit>=3.4.0",
    "pytest>=7.4.0",
    "pytest-mock>=3.11.1"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short"
]
markers = [
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.black]
line-length = 88
target-version = ['py313']
skip-string-normalization = true
